[package]
name = "combinr"
version = "0.2.0"
edition = "2024"
description = "PASA + EVidenceModeler evidence-combining genome-annotation algorithms as a single self-contained Rust binary"
repository = "https://github.com/BFL-lab/combinr"
license = "BSD-3-Clause"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
fixedbitset = "0.5.7"
noodles = { version = "0.111", features = ["bam", "sam"] }
rayon = "1.12.0"
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
